<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar App - SAAD CREATIONS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="calendar">
            <div class="header">
                <div class="month-year">
                    <button id="prev-month"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="month-display">Month Year</h2>
                    <button id="next-month"><i class="fas fa-chevron-right"></i></button>
                </div>
                <button id="add-event-btn" class="add-event">Add Event</button>
            </div>
            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>
            <div class="days" id="calendar-days">
                <!-- Days will be filled by JavaScript -->
            </div>
        </div>
        
        <div id="event-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Add New Event</h3>
                <form id="event-form">
                    <div class="form-group">
                        <label for="event-title">Event Title:</label>
                        <input type="text" id="event-title" required>
                    </div>
                    <div class="form-group">
                        <label for="event-date">Date:</label>
                        <input type="date" id="event-date" required>
                    </div>
                    <div class="form-group">
                        <label for="event-time">Time:</label>
                        <input type="time" id="event-time">
                    </div>
                    <div class="form-group">
                        <label for="event-description">Description:</label>
                        <textarea id="event-description"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Save Event</button>
                </form>
            </div>
        </div>
        
        <div id="events-list-container">
            <h3>Upcoming Events</h3>
            <div id="events-list">
                <!-- Events will be displayed here -->
            </div>
        </div>
        
        <div class="branding">
            <p>BY SAAD CREATIONS &copy; 2025</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
